name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Revisar el manifest
        run: |
          jq -e '.schemaVersion == 1 and .id == "page.doro.pomodoro" and (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+"))' manifest.json
          for f in $(jq -r '.entryPoints[]' manifest.json); do test -f "$f"; done
          test -z "$(find . -path ./.git -prune -o -type l -print)"

      - name: Probar la lógica del reloj
        run: |
          node tests/model.test.mjs
          node tests/supabase.test.mjs
